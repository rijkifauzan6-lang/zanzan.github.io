<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Soft Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"><style>
:root {
  --bg1: #f0f7ff;
  --bg2: #f7fbff;
  --card: rgba(255,255,255,0.9);
  --text: #334155;
  --soft: #94a3b8;
  --accent: #dbeafe;
}

* {
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 360px;
}

.title {
  text-align: center;
  font-weight: 500;
  margin-bottom: 18px;
  color: var(--text);
  font-size: 18px;
}

.card {
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 15px 16px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.35s ease;
  box-shadow: 0 6px 18px rgba(0,0,0,0.04);
}

.card:hover {
  transform: translateY(-2px);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.day {
  font-weight: 500;
  color: var(--text);
}

.arrow {
  transition: 0.3s;
  color: var(--soft);
}

.card.active .arrow {
  transform: rotate(180deg);
}

.subjects {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: all 0.4s ease;
}

.card.active .subjects {
  max-height: 300px;
  opacity: 1;
  margin-top: 12px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 9px 12px;
  border-radius: 12px;
  margin: 6px 0;
  background: var(--accent);
  transform: translateY(8px);
  opacity: 0;
  transition: 0.3s ease;
  font-size: 14px;
}

.card.active .item {
  transform: translateY(0);
  opacity: 1;
}

.item span {
  font-size: 12px;
  color: var(--soft);
}

.card.active .item:nth-child(1) { transition-delay: 0.05s; }
.card.active .item:nth-child(2) { transition-delay: 0.1s; }
.card.active .item:nth-child(3) { transition-delay: 0.15s; }

.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: var(--soft);
}

</style></head>
<body><div class="container"><div class="title">☁️ Jadwal Pelajaran ☁️</div><div class="card" onclick="toggle(this)">
  <div class="header">
    <div class="day">Senin</div>
    <div class="arrow">⌄</div>
  </div>
  <div class="subjects">
    <div class="item">Matematika <span>07:00</span></div>
    <div class="item">Indonesia <span>09:00</span></div>
    <div class="item">IPA <span>11:00</span></div>
  </div>
</div><div class="card" onclick="toggle(this)">
  <div class="header">
    <div class="day">Selasa</div>
    <div class="arrow">⌄</div>
  </div>
  <div class="subjects">
    <div class="item">Inggris <span>07:00</span></div>
    <div class="item">IPS <span>09:00</span></div>
    <div class="item">Olahraga <span>11:00</span></div>
  </div>
</div><div class="card" onclick="toggle(this)">
  <div class="header">
    <div class="day">Rabu</div>
    <div class="arrow">⌄</div>
  </div>
  <div class="subjects">
    <div class="item">Matematika <span>07:00</span></div>
    <div class="item">Seni <span>09:00</span></div>
  </div>
</div><div class="card" onclick="toggle(this)">
  <div class="header">
    <div class="day">Kamis</div>
    <div class="arrow">⌄</div>
  </div>
  <div class="subjects">
    <div class="item">IPA <span>07:00</span></div>
    <div class="item">Indonesia <span>09:00</span></div>
  </div>
</div><div class="card" onclick="toggle(this)">
  <div class="header">
    <div class="day">Jumat</div>
    <div class="arrow">⌄</div>
  </div>
  <div class="subjects">
    <div class="item">Agama <span>07:00</span></div>
    <div class="item">PKN <span>09:00</span></div>
  </div>
</div><div class="footer">klik hari untuk melihat jadwal</div></div><script>
function toggle(el) {
  el.classList.toggle('active');
}
</script></body>
</html>
